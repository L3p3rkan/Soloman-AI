services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solomon
      POSTGRES_USER: solomon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solomon"]
      interval: 10s
      timeout: 5s
      retries: 5

  solomon:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      PUBLIC_DIR: /app/public

      # PostgreSQL — points at the postgres service above
      DATABASE_URL: postgres://solomon:${POSTGRES_PASSWORD:-changeme}@postgres:5432/solomon

      # Clerk authentication — required, get from your Clerk dashboard
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

      # AI (OpenAI-compatible) — required for Solomon chat
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY}

      # Optional: restrict Bible admin actions to specific emails
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
